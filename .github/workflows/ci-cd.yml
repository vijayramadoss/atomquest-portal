name: Unified CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-validate-test:
    name: Build & Validate Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./services/backend
        run: npm ci

      - name: Compile Backend TypeScript
        working-directory: ./services/backend
        run: npm run build

      - name: Verify Backend Integrity
        working-directory: ./services/backend
        run: npx tsx test-api.ts
        env:
          NODE_ENV: test

      - name: Install Frontend Dependencies
        working-directory: ./services/frontend
        run: npm ci

      - name: Build Next.js Optimized Production Payload
        working-directory: ./services/frontend
        run: npm run build
        env:
          # Assuming you inject API URLs via GitHub Secrets
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Dockerize Architecture (Dry-Run)
        run: docker-compose build

  deploy-vercel:
    name: Deploy Next.js to Vercel (Production)
    needs: build-validate-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vercel Action
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./services/frontend
          vercel-args: '--prod'

  deploy-render:
    name: Deploy Express API to Render (Production)
    needs: build-validate-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook Hook
        run: |
          echo "Triggering automated build pipeline on Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
