version: '3.8'

services:
  backend:
    build:
      context: ./services/backend
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=development
      - PORT=5005
      - MONGO_URI=mongodb://mongo:27017/atomquest
    depends_on:
      - mongo

  frontend:
    build:
      context: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:5005/api
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
